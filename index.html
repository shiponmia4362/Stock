<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BirdVault 3D — Adobe Stock Bird Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #eef1f9;
  --bg-2: #dfe4f3;
  --surface: rgba(255,255,255,0.72);
  --surface-solid: #ffffff;
  --surface-2: rgba(248,250,252,0.8);
  --glass-border: rgba(255,255,255,0.65);
  --text: #0b1220;
  --text-muted: #5a6478;
  --border: rgba(148,163,184,0.35);
  --primary: #6366f1;
  --primary-hover: #4f46e5;
  --primary-soft: rgba(99,102,241,0.12);
  --success: #10b981;
  --success-soft: rgba(16,185,129,0.12);
  --danger: #ef4444;
  --danger-soft: rgba(239,68,68,0.12);
  --warning: #f59e0b;
  --warning-soft: rgba(245,158,11,0.12);
  --shadow-sm: 0 2px 6px rgba(15,23,42,.06);
  --shadow: 0 10px 30px rgba(15,23,42,.10), 0 2px 8px rgba(15,23,42,.06);
  --shadow-lg: 0 24px 60px rgba(15,23,42,.18), 0 8px 20px rgba(15,23,42,.08);
  --shadow-3d: 0 1px 0 rgba(255,255,255,.9) inset, 0 -1px 0 rgba(0,0,0,.04) inset,
               0 12px 24px rgba(15,23,42,.10), 0 24px 48px rgba(15,23,42,.08);
  --radius: 18px;
  --radius-sm: 12px;
  --sidebar-w: 250px;
  --header-h: 66px;
  --footer-h: 52px;
  --transition: .22s cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"] {
  --bg: #070b16;
  --bg-2: #0d1425;
  --surface: rgba(17,26,46,0.72);
  --surface-solid: #111a2e;
  --surface-2: rgba(15,23,42,0.85);
  --glass-border: rgba(148,163,184,0.18);
  --text: #e6edf7;
  --text-muted: #94a3b8;
  --border: rgba(51,65,85,0.6);
  --primary-soft: rgba(99,102,241,0.18);
  --success-soft: rgba(16,185,129,0.16);
  --danger-soft: rgba(239,68,68,0.16);
  --warning-soft: rgba(245,158,11,0.16);
  --shadow-sm: 0 2px 6px rgba(0,0,0,.4);
  --shadow: 0 10px 30px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.4);
  --shadow-lg: 0 24px 60px rgba(0,0,0,.65), 0 8px 20px rgba(0,0,0,.4);
  --shadow-3d: 0 1px 0 rgba(255,255,255,.06) inset, 0 -1px 0 rgba(0,0,0,.4) inset,
               0 12px 24px rgba(0,0,0,.4), 0 24px 48px rgba(0,0,0,.3);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  color: var(--text);
  background: var(--bg);
  overflow: hidden;
  transition: background var(--transition), color var(--transition);
  perspective: 1400px;
}
/* animated 3D background orbs */
.bg-scene { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.bg-scene::before {
  content: ''; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 20% 25%, rgba(99,102,241,.28), transparent 40%),
    radial-gradient(circle at 80% 15%, rgba(236,72,153,.20), transparent 42%),
    radial-gradient(circle at 65% 85%, rgba(16,185,129,.22), transparent 45%),
    radial-gradient(circle at 10% 90%, rgba(59,130,246,.20), transparent 40%);
  filter: blur(40px);
  animation: floatBg 22s ease-in-out infinite alternate;
}
@keyframes floatBg {
  0%   { transform: translate3d(0,0,0) scale(1); }
  100% { transform: translate3d(-3%, -2%, 0) scale(1.08); }
}
.bg-orb {
  position: absolute; border-radius: 50%; filter: blur(30px); opacity: .55;
  animation: orbFloat 16s ease-in-out infinite alternate;
}
.bg-orb.o1 { width: 340px; height: 340px; top: 8%; left: 6%; background: radial-gradient(circle,#6366f1,#8b5cf6); }
.bg-orb.o2 { width: 260px; height: 260px; bottom: 12%; right: 8%; background: radial-gradient(circle,#06b6d4,#3b82f6); animation-delay: -4s; }
.bg-orb.o3 { width: 200px; height: 200px; top: 55%; left: 55%; background: radial-gradient(circle,#f59e0b,#ef4444); animation-delay: -8s; opacity:.35; }
@keyframes orbFloat {
  0%   { transform: translate(0,0) scale(1); }
  100% { transform: translate(40px,-30px) scale(1.15); }
}
button { font-family: inherit; cursor: pointer; }
input, select { font-family: inherit; }

/* ================= APP SHELL ================= */
.app {
  position: relative; z-index: 1;
  display: flex;
  height: 100vh;
  width: 100vw;
  padding: 14px;
  gap: 14px;
  transform-style: preserve-3d;
}

/* ================= SIDEBAR (3D glass) ================= */
.sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  background: var(--surface);
  backdrop-filter: blur(22px) saturate(160%);
  -webkit-backdrop-filter: blur(22px) saturate(160%);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-3d);
  display: flex; flex-direction: column;
  transition: margin-left .32s cubic-bezier(.4,0,.2,1), opacity .32s, transform .32s;
  transform-style: preserve-3d;
  overflow: hidden;
}
.sidebar.hidden {
  margin-left: calc(-1 * (var(--sidebar-w) + 14px));
  opacity: 0;
  pointer-events: none;
  transform: translateX(-20px) rotateY(12deg);
}
.brand {
  display: flex; align-items: center; gap: 11px;
  padding: 18px 18px 14px;
  font-weight: 900; font-size: 17px; letter-spacing: -.4px;
  border-bottom: 1px solid var(--border);
}
.brand-logo {
  width: 38px; height: 38px; border-radius: 12px;
  background: linear-gradient(135deg,#6366f1,#8b5cf6 55%,#ec4899);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; color: #fff; flex-shrink: 0;
  box-shadow: 0 8px 18px rgba(99,102,241,.45), inset 0 1px 0 rgba(255,255,255,.4);
  transform: translateZ(20px);
}
.brand .close-sidebar {
  margin-left: auto; width: 32px; height: 32px; border-radius: 9px;
  border: 1px solid var(--border); background: var(--surface-2);
  color: var(--text); font-size: 15px; display: flex; align-items: center; justify-content: center;
  transition: all var(--transition);
}
.brand .close-sidebar:hover { background: var(--danger-soft); color: var(--danger); border-color: var(--danger); }

.nav { flex: 1; padding: 10px 12px; display: flex; flex-direction: column; gap: 3px; overflow-y: auto; }
.nav::-webkit-scrollbar { width: 6px; }
.nav::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.nav-label {
  font-size: 10.5px; font-weight: 800; text-transform: uppercase;
  letter-spacing: 1px; color: var(--text-muted);
  padding: 14px 10px 6px;
}
.nav-item {
  display: flex; align-items: center; gap: 11px;
  padding: 10px 12px; border-radius: var(--radius-sm);
  border: 1px solid transparent; background: transparent; color: var(--text-muted);
  font-size: 13.5px; font-weight: 600; text-align: left; width: 100%;
  transition: all var(--transition);
  transform-style: preserve-3d;
}
.nav-item:hover { background: var(--surface-2); color: var(--text); transform: translateX(2px) translateZ(6px); }
.nav-item.active {
  background: linear-gradient(135deg, rgba(99,102,241,.16), rgba(139,92,246,.10));
  color: var(--primary);
  border-color: rgba(99,102,241,.35);
  box-shadow: 0 6px 16px rgba(99,102,241,.18), inset 0 1px 0 rgba(255,255,255,.25);
  transform: translateZ(10px);
}
.nav-item .icon { font-size: 17px; width: 20px; text-align: center; }
.nav-item .count {
  margin-left: auto; font-size: 11px; font-weight: 800;
  background: var(--surface-2); padding: 2px 8px; border-radius: 20px;
  color: var(--text-muted); min-width: 24px; text-align: center;
  border: 1px solid var(--border);
}
.nav-item.active .count {
  background: linear-gradient(135deg,#6366f1,#8b5cf6); color: #fff; border-color: transparent;
  box-shadow: 0 4px 10px rgba(99,102,241,.4);
}
.sidebar-footer { padding: 12px; border-top: 1px solid var(--border); }
.sync-chip {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 12px; border-radius: var(--radius-sm);
  background: var(--surface-2); font-size: 12px; font-weight: 600;
  color: var(--text-muted); border: 1px solid var(--border);
}
.status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.dot-ok { background: var(--success); box-shadow: 0 0 0 3px var(--success-soft); }
.dot-err { background: var(--danger); box-shadow: 0 0 0 3px var(--danger-soft); }
.dot-busy { background: var(--warning); box-shadow: 0 0 0 3px var(--warning-soft); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .4; } }

/* ================= MAIN PANEL ================= */
.main-panel {
  flex: 1; display: flex; flex-direction: column;
  background: var(--surface);
  backdrop-filter: blur(22px) saturate(160%);
  -webkit-backdrop-filter: blur(22px) saturate(160%);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-3d);
  overflow: hidden;
  min-width: 0;
  transform-style: preserve-3d;
}

/* HEADER (frozen) */
.topbar {
  height: var(--header-h); flex-shrink: 0;
  display: flex; align-items: center; gap: 14px;
  padding: 0 20px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,0));
}
[data-theme="dark"] .topbar { background: linear-gradient(180deg, rgba(255,255,255,.03), transparent); }
.menu-toggle {
  display: flex; align-items: center; justify-content: center;
  width: 40px; height: 40px; border-radius: 11px;
  border: 1px solid var(--border); background: var(--surface-2);
  color: var(--text); font-size: 18px; flex-shrink: 0;
  transition: all var(--transition);
  box-shadow: var(--shadow-sm);
}
.menu-toggle:hover { border-color: var(--primary); color: var(--primary); transform: translateY(-1px); }
.page-title { font-size: 19px; font-weight: 900; letter-spacing: -.5px; flex-shrink: 0; }
.search-wrap { position: relative; flex: 1; max-width: 360px; margin-left: 6px; }
.search-wrap .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 14px; }
.search-wrap input {
  width: 100%; padding: 10px 12px 10px 36px;
  border: 1px solid var(--border); border-radius: 11px;
  background: var(--surface-2); color: var(--text); font-size: 13.5px; font-weight: 500;
  transition: all var(--transition);
  box-shadow: inset 0 1px 2px rgba(0,0,0,.03);
}
.search-wrap input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); background: var(--surface-solid); }
.topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 11px;
  border: 1px solid var(--border); background: var(--surface-2);
  color: var(--text); display: flex; align-items: center; justify-content: center;
  font-size: 16px; transition: all var(--transition); box-shadow: var(--shadow-sm);
}
.icon-btn:hover { background: var(--surface-solid); border-color: var(--primary); color: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow); }

/* SCROLLABLE CONTENT (only middle scrolls) */
.content {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  padding: 22px 24px;
  scroll-behavior: smooth;
  transform-style: preserve-3d;
}
.content::-webkit-scrollbar { width: 10px; }
.content::-webkit-scrollbar-track { background: transparent; }
.content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
.content::-webkit-scrollbar-thumb:hover { background: var(--text-muted); background-clip: padding-box; border: 2px solid transparent; }

/* FOOTER (frozen) */
.footer {
  height: var(--footer-h); flex-shrink: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px;
  border-top: 1px solid var(--border);
  background: linear-gradient(0deg, rgba(255,255,255,.35), rgba(255,255,255,0));
  font-size: 12px; font-weight: 600; color: var(--text-muted);
  gap: 12px;
}
[data-theme="dark"] .footer { background: linear-gradient(0deg, rgba(255,255,255,.03), transparent); }
.footer .kbd-hint { display: flex; gap: 12px; }
.footer kbd {
  display: inline-block; padding: 2px 7px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--surface-2);
  font-family: inherit; font-size: 11px; font-weight: 700; color: var(--text);
  box-shadow: 0 1px 0 var(--border);
}

/* ================= TOOLBAR ================= */
.toolbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  margin-bottom: 18px;
}
.toolbar select {
  padding: 9px 12px; border-radius: 11px; border: 1px solid var(--border);
  background: var(--surface-2); color: var(--text); font-size: 12.5px; font-weight: 700;
  cursor: pointer; box-shadow: var(--shadow-sm);
}
.toolbar select:focus { outline: none; border-color: var(--primary); }
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 9px 15px; border-radius: 11px; border: 1px solid var(--border);
  background: var(--surface-2); color: var(--text);
  font-size: 12.5px; font-weight: 700; transition: all var(--transition);
  box-shadow: var(--shadow-sm);
}
.btn:hover { background: var(--surface-solid); transform: translateY(-1px); box-shadow: var(--shadow); }
.btn-primary {
  background: linear-gradient(135deg,#6366f1,#8b5cf6);
  border-color: transparent; color: #fff;
  box-shadow: 0 8px 20px rgba(99,102,241,.4), inset 0 1px 0 rgba(255,255,255,.3);
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(99,102,241,.5), inset 0 1px 0 rgba(255,255,255,.3); }
.btn-ghost { border-color: transparent; background: transparent; box-shadow: none; }
.btn-ghost:hover { background: var(--surface-2); transform: none; box-shadow: none; }
.btn-danger { color: var(--danger); border-color: var(--danger-soft); background: var(--danger-soft); }
.btn-danger:hover { background: var(--danger); color: #fff; border-color: var(--danger); }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none !important; }

/* ================= ADD FORM (3D card) ================= */
.add-card {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px 20px;
  box-shadow: var(--shadow-3d); margin-bottom: 20px;
  display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end;
  transition: transform var(--transition), box-shadow var(--transition);
}
.add-card:hover { transform: translateY(-2px) rotateX(1deg); box-shadow: var(--shadow-lg); }
.field { flex: 1; min-width: 180px; }
.field label { display: block; font-size: 11px; font-weight: 800; margin-bottom: 6px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .6px; }
.field input {
  width: 100%; padding: 11px 14px; border-radius: 11px;
  border: 1px solid var(--border); background: var(--surface-solid);
  color: var(--text); font-size: 14px; font-weight: 500;
  transition: all var(--transition);
  box-shadow: inset 0 1px 2px rgba(0,0,0,.03);
}
.field input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.add-card .btn-primary { height: 44px; padding: 0 22px; font-size: 13px; }

/* ================= GRID / 3D CARDS ================= */
.grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 16px;
  perspective: 1200px;
}
.bird-card {
  background: var(--surface-solid);
  border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px;
  box-shadow: var(--shadow-3d);
  position: relative;
  transition: transform .28s cubic-bezier(.34,1.4,.64,1), box-shadow .28s;
  display: flex; flex-direction: column; gap: 12px;
  transform-style: preserve-3d;
  animation: fadeUp .4s ease both;
  will-change: transform;
}
@keyframes fadeUp { from { opacity: 0; transform: translateY(14px) rotateX(4deg); } to { opacity: 1; transform: translateY(0) rotateX(0); } }
.bird-card:hover {
  transform: translateY(-6px) rotateX(3deg) rotateY(-2deg) scale(1.015);
  box-shadow: 0 30px 60px rgba(15,23,42,.20), 0 10px 20px rgba(15,23,42,.10),
              inset 0 1px 0 rgba(255,255,255,.9);
  border-color: var(--primary);
}
[data-theme="dark"] .bird-card:hover { box-shadow: 0 30px 60px rgba(0,0,0,.7), 0 10px 20px rgba(0,0,0,.4); }
.bird-card::before {
  content: ''; position: absolute; left: 0; top: 14px; bottom: 14px; width: 4px; border-radius: 0 4px 4px 0;
  box-shadow: 0 0 12px currentColor;
}
.bird-card[data-status="working"]::before { background: var(--primary); color: var(--primary); }
.bird-card[data-status="accepted"]::before { background: var(--success); color: var(--success); }
.bird-card[data-status="rejected"]::before { background: var(--danger); color: var(--danger); }
.bird-top { display: flex; align-items: flex-start; gap: 10px; transform: translateZ(10px); }
.bird-emoji {
  width: 44px; height: 44px; border-radius: 13px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 23px;
  background: linear-gradient(135deg, var(--surface-2), var(--surface-solid));
  border: 1px solid var(--border);
  box-shadow: 0 6px 14px rgba(15,23,42,.10), inset 0 1px 0 rgba(255,255,255,.7);
}
.bird-title { flex: 1; min-width: 0; }
.bird-name { font-weight: 800; font-size: 15px; line-height: 1.3; word-break: break-word; letter-spacing: -.2px; }
.bird-country { font-size: 12.5px; color: var(--text-muted); font-weight: 600; margin-top: 3px; display: flex; align-items: center; gap: 5px; }
.pill {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 10.5px; font-weight: 800; padding: 4px 10px; border-radius: 20px;
  text-transform: uppercase; letter-spacing: .4px;
  border: 1px solid transparent;
}
.pill-working { background: var(--primary-soft); color: var(--primary); border-color: rgba(99,102,241,.3); }
.pill-accepted { background: var(--success-soft); color: var(--success); border-color: rgba(16,185,129,.3); }
.pill-rejected { background: var(--danger-soft); color: var(--danger); border-color: rgba(239,68,68,.3); }
.bird-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.bird-date { font-size: 11px; color: var(--text-muted); font-weight: 600; }
.bird-actions { display: flex; gap: 5px; flex-wrap: wrap; transform: translateZ(8px); }
.act {
  width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--border);
  background: var(--surface-2); color: var(--text-muted);
  display: flex; align-items: center; justify-content: center; font-size: 13px;
  transition: all var(--transition);
}
.act:hover { transform: translateY(-2px) scale(1.08); box-shadow: var(--shadow-sm); }
.act-copy:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
.act-accept:hover { border-color: var(--success); color: var(--success); background: var(--success-soft); }
.act-reject:hover { border-color: var(--danger); color: var(--danger); background: var(--danger-soft); }
.act-edit:hover { border-color: var(--warning); color: var(--warning); background: var(--warning-soft); }
.act-delete:hover { border-color: var(--danger); color: var(--danger); background: var(--danger-soft); }

/* ================= EMPTY ================= */
.empty { text-align: center; padding: 70px 20px; color: var(--text-muted); }
.empty-emoji { font-size: 56px; margin-bottom: 14px; opacity: .8; filter: drop-shadow(0 8px 16px rgba(99,102,241,.3)); }
.empty h3 { font-size: 17px; color: var(--text); margin-bottom: 6px; font-weight: 800; }
.empty p { font-size: 13.5px; }

/* ================= STATS ================= */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 20px; }
.stat {
  background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px 18px; box-shadow: var(--shadow-3d);
  transition: transform var(--transition), box-shadow var(--transition);
}
.stat:hover { transform: translateY(-4px) rotateX(2deg); box-shadow: var(--shadow-lg); }
.stat-label { font-size: 11.5px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 6px; }
.stat-value { font-size: 28px; font-weight: 900; letter-spacing: -1.2px; }
.stat-value.c-primary { color: var(--primary); }
.stat-value.c-success { color: var(--success); }
.stat-value.c-danger { color: var(--danger); }
.stat-value.c-text { color: var(--text); }

/* ================= MODALS ================= */
.overlay {
  position: fixed; inset: 0; background: rgba(10,15,28,.55);
  backdrop-filter: blur(6px); z-index: 500;
  display: flex; align-items: center; justify-content: center; padding: 20px;
  animation: fadeIn .2s ease; perspective: 1400px;
}
@keyframes fadeIn { from { opacity: 0; } }
.modal {
  background: var(--surface-solid); border-radius: 20px; width: 100%; max-width: 480px;
  box-shadow: var(--shadow-lg); animation: popIn .3s cubic-bezier(.34,1.56,.64,1);
  max-height: 88vh; overflow-y: auto;
  border: 1px solid var(--glass-border);
  transform-style: preserve-3d;
}
.modal.wide { max-width: 660px; }
@keyframes popIn { from { opacity: 0; transform: scale(.94) rotateX(6deg); } }
.modal-head { padding: 20px 24px 0; display: flex; align-items: center; justify-content: space-between; }
.modal-head h3 { font-size: 18px; font-weight: 900; letter-spacing: -.3px; }
.modal-close { background: none; border: none; font-size: 18px; color: var(--text-muted); width: 34px; height: 34px; border-radius: 9px; transition: all var(--transition); }
.modal-close:hover { background: var(--surface-2); color: var(--text); }
.modal-body { padding: 18px 24px 24px; display: flex; flex-direction: column; gap: 14px; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; padding-top: 6px; }
.modal-actions .btn { padding: 10px 20px; }

/* settings */
.settings-section { border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 4px; }
.settings-section:last-child { border-bottom: none; }
.settings-section h4 { font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: .8px; color: var(--text-muted); margin-bottom: 12px; }
.settings-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; }
.settings-row .lbl { font-size: 13.5px; font-weight: 700; }
.settings-row .hint { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; font-weight: 500; }
.switch { position: relative; width: 44px; height: 25px; flex-shrink: 0; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; inset: 0; background: var(--border); border-radius: 30px; transition: .2s; cursor: pointer; }
.slider::before { content: ''; position: absolute; height: 19px; width: 19px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.switch input:checked + .slider { background: linear-gradient(135deg,#6366f1,#8b5cf6); }
.switch input:checked + .slider::before { transform: translateX(19px); }
.help { font-size: 11.5px; color: var(--text-muted); line-height: 1.6; }
.help code { background: var(--surface-2); padding: 1px 6px; border-radius: 5px; font-size: 11px; border: 1px solid var(--border); }

/* ================= TOASTS ================= */
.toast-container { position: fixed; top: 20px; right: 20px; z-index: 900; display: flex; flex-direction: column; gap: 10px; max-width: 360px; }
.toast {
  display: flex; align-items: flex-start; gap: 11px;
  padding: 14px 16px; border-radius: 13px; background: var(--surface-solid);
  border: 1px solid var(--border); box-shadow: var(--shadow-lg);
  animation: slideIn .3s cubic-bezier(.34,1.56,.64,1); font-size: 13px; font-weight: 600;
}
.toast.success { border-left: 4px solid var(--success); }
.toast.error { border-left: 4px solid var(--danger); }
.toast.warning { border-left: 4px solid var(--warning); }
.toast.info { border-left: 4px solid var(--primary); }
.toast .t-icon { font-size: 17px; flex-shrink: 0; }
.toast .t-body { flex: 1; }
.toast .t-title { font-weight: 800; font-size: 13px; }
.toast .t-msg { font-weight: 500; color: var(--text-muted); margin-top: 2px; font-size: 12px; }
@keyframes slideIn { from { transform: translateX(110%); opacity: 0; } }
.toast.leaving { animation: slideOut .22s ease forwards; }
@keyframes slideOut { to { transform: translateX(110%); opacity: 0; } }

/* ================= RESPONSIVE ================= */
@media (max-width: 900px) {
  .app { padding: 8px; gap: 8px; }
  .sidebar {
    position: fixed; top: 8px; bottom: 8px; left: 8px;
    z-index: 200;
    box-shadow: var(--shadow-lg);
    margin-left: 0;
  }
  .sidebar.hidden {
    margin-left: calc(-1 * (var(--sidebar-w) + 40px));
    transform: translateX(-30px) rotateY(15deg);
  }
  .menu-toggle { display: flex; }
  .topbar { padding: 0 14px; gap: 10px; }
  .page-title { font-size: 16px; }
  .search-wrap { display: none; }
  .content { padding: 16px 14px; }
  .footer { padding: 0 14px; }
  .footer .kbd-hint { display: none; }
}
@media (min-width: 901px) {
  .menu-toggle { display: flex; }
  .brand .close-sidebar { display: flex; }
}
@media (max-width: 560px) {
  .grid { grid-template-columns: 1fr; }
  .add-card { flex-direction: column; align-items: stretch; }
  .add-card .btn-primary { width: 100%; }
}
@media (min-width: 901px) {
  /* On desktop, allow closing sidebar too — main panel expands */
}
</style>
</head>
<body>
<div class="bg-scene">
  <div class="bg-orb o1"></div>
  <div class="bg-orb o2"></div>
  <div class="bg-orb o3"></div>
</div>

<div class="app">
  <!-- ========== SIDEBAR ========== -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">🐦</div>
      <div>BirdVault</div>
      <button class="close-sidebar" id="closeSidebar" title="Hide menu (Esc)">✕</button>
    </div>
    <nav class="nav">
      <div class="nav-label">Library</div>
      <button class="nav-item active" data-view="all">
        <span class="icon">🗂️</span> All Birds
        <span class="count" id="nav-all">0</span>
      </button>
      <button class="nav-item" data-view="working">
        <span class="icon">🛠️</span> Working Birds
        <span class="count" id="nav-working">0</span>
      </button>
      <button class="nav-item" data-view="accepted">
        <span class="icon">✅</span> Accepted Birds
        <span class="count" id="nav-accepted">0</span>
      </button>
      <button class="nav-item" data-view="rejected">
        <span class="icon">❌</span> Rejected Birds
        <span class="count" id="nav-rejected">0</span>
      </button>
      <div class="nav-label">Tools</div>
      <button class="nav-item" data-view="stats">
        <span class="icon">📊</span> Dashboard
      </button>
      <button class="nav-item" id="navSettings">
        <span class="icon">⚙️</span> Settings
      </button>
    </nav>
    <div class="sidebar-footer">
      <div class="sync-chip" id="syncChip">
        <span class="status-dot dot-err" id="syncDot"></span>
        <span id="syncText">Not connected</span>
      </div>
    </div>
  </aside>

  <!-- ========== MAIN PANEL ========== -->
  <main class="main-panel">
    <!-- FROZEN HEADER -->
    <header class="topbar">
      <button class="menu-toggle" id="menuToggle" title="Toggle menu">☰</button>
      <h1 class="page-title" id="pageTitle">All Birds</h1>
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Search by name or country...">
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="themeToggle" title="Toggle theme">🌙</button>
        <button class="icon-btn" id="quickAdd" title="Add bird (N)">➕</button>
      </div>
    </header>

    <!-- SCROLLABLE CONTENT -->
    <div class="content" id="content"></div>

    <!-- FROZEN FOOTER -->
    <footer class="footer">
      <span>© <span id="year"></span> BirdVault · Adobe Stock Bird Manager</span>
      <span class="kbd-hint">
        <span><kbd>N</kbd> new</span>
        <span><kbd>/</kbd> search</span>
        <span><kbd>Esc</kbd> close</span>
      </span>
    </footer>
  </main>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
/* =========================================================
   STATE
========================================================= */
const STORAGE_KEY = 'birdvault_data_v3';
const CONFIG_KEY  = 'birdvault_config_v3';
const THEME_KEY   = 'birdvault_theme_v3';

let state = {
  birds: [],
  view: 'all',
  search: '',
  sort: 'newest',
  filterCountry: '',
  theme: 'light',
};

let config = {
  token: '', repo: '', path: 'birds.json', branch: 'main',
  sha: null, autoSync: true,
};

let syncing = false;

/* =========================================================
   UTILITIES
========================================================= */
function $(sel, root = document) { return root.querySelector(sel); }
function $$(sel, root = document) { return [...root.querySelectorAll(sel)]; }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function formatDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}
function debounce(fn, ms = 250) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

/* =========================================================
   TOASTS
========================================================= */
function toast(type, title, msg = '') {
  const icons = { success: '✅', error: '⛔', warning: '⚠️', info: 'ℹ️' };
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `
    <div class="t-icon">${icons[type] || 'ℹ️'}</div>
    <div class="t-body">
      <div class="t-title">${escapeHtml(title)}</div>
      ${msg ? `<div class="t-msg">${escapeHtml(msg)}</div>` : ''}
    </div>`;
  $('#toastContainer').appendChild(el);
  setTimeout(() => { el.classList.add('leaving'); setTimeout(() => el.remove(), 230); }, 3200);
}

/* =========================================================
   PERSISTENCE — LOCAL
========================================================= */
function saveLocal() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.birds));
    localStorage.setItem(CONFIG_KEY, JSON.stringify(config));
  } catch (e) { console.warn('localStorage save failed', e); }
}
function loadLocal() {
  try {
    const b = localStorage.getItem(STORAGE_KEY); if (b) state.birds = JSON.parse(b);
    const c = localStorage.getItem(CONFIG_KEY); if (c) config = { ...config, ...JSON.parse(c) };
    const t = localStorage.getItem(THEME_KEY); if (t) state.theme = t;
  } catch (e) { console.warn('localStorage load failed', e); }
}

/* =========================================================
   PERSISTENCE — GITHUB
========================================================= */
function isConnected() { return !!(config.token && config.repo && config.path); }

function setSyncStatus(kind, text) {
  const dot = $('#syncDot'), txt = $('#syncText');
  dot.className = 'status-dot ' + (kind === 'ok' ? 'dot-ok' : kind === 'busy' ? 'dot-busy' : 'dot-err');
  txt.textContent = text;
  $('#syncChip').title = text;
}

async function ghRequest(method, url, body) {
  const resp = await fetch(url, {
    method,
    headers: {
      'Authorization': `Bearer ${config.token}`,
      'Accept': 'application/vnd.github.v3+json',
      'Content-Type': 'application/json',
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!resp.ok) {
    let msg = `HTTP ${resp.status}`;
    try { const j = await resp.json(); msg = j.message || msg; } catch {}
    throw new Error(msg);
  }
  return resp.json();
}

async function githubLoad(silent = false) {
  if (!isConnected()) {
    if (!silent) toast('warning', 'GitHub not configured', 'Open Settings to add token & repo.');
    return false;
  }
  setSyncStatus('busy', 'Loading…');
  try {
    const url = `https://api.github.com/repos/${config.repo}/contents/${config.path}?ref=${config.branch}`;
    const resp = await fetch(url, {
      headers: { 'Authorization': `Bearer ${config.token}`, 'Accept': 'application/vnd.github.v3+json' },
    });
    if (resp.status === 404) { config.sha = null; saveLocal(); setSyncStatus('ok', 'Connected · empty'); return true; }
    if (!resp.ok) { const err = await resp.json().catch(() => ({})); throw new Error(err.message || `HTTP ${resp.status}`); }
    const data = await resp.json();
    const decoded = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ''))));
    const remoteBirds = JSON.parse(decoded || '[]');
    if (Array.isArray(remoteBirds)) {
      state.birds = remoteBirds;
      config.sha = data.sha;
      saveLocal(); render();
      setSyncStatus('ok', `Synced · ${state.birds.length} birds`);
      if (!silent) toast('success', 'Data loaded from GitHub', `${state.birds.length} birds`);
      return true;
    }
    throw new Error('Invalid file format');
  } catch (e) {
    console.error(e);
    setSyncStatus('err', 'Sync error');
    if (!silent) toast('error', 'GitHub load failed', e.message);
    return false;
  }
}

async function githubSave(silent = false) {
  if (!isConnected() || !config.autoSync) return false;
  if (syncing) return false;
  syncing = true;
  setSyncStatus('busy', 'Saving…');
  try {
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(state.birds, null, 2))));
    const body = { message: `Update birds — ${new Date().toLocaleString('en-US')}`, content, branch: config.branch };
    if (config.sha) body.sha = config.sha;
    const data = await ghRequest('PUT', `https://api.github.com/repos/${config.repo}/contents/${config.path}`, body);
    config.sha = data.content.sha;
    saveLocal();
    setSyncStatus('ok', `Synced · ${state.birds.length} birds`);
    if (!silent) toast('success', 'Synced to GitHub', `${state.birds.length} birds saved`);
    return true;
  } catch (e) {
    console.error(e);
    setSyncStatus('err', 'Save failed');
    toast('error', 'GitHub save failed', e.message);
    return false;
  } finally { syncing = false; }
}

/* =========================================================
   BUSINESS LOGIC
========================================================= */
function findBird(id) { return state.birds.find(b => b.id === id); }
function isDuplicateName(name, excludeId = null) {
  const n = name.trim().toLowerCase();
  return state.birds.some(b => b.id !== excludeId && b.name.trim().toLowerCase() === n);
}
function addBird(name, country) {
  name = name.trim(); country = country.trim();
  if (!name || !country) { toast('warning', 'Missing fields', 'Please enter both name and country.'); return false; }
  if (isDuplicateName(name)) { toast('error', `"${name}" already exists`, 'Duplicate entries are not allowed.'); return false; }
  state.birds.push({ id: uid(), name, country, status: 'working', createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() });
  saveLocal(); render(); githubSave(true);
  toast('success', 'Bird added', `${name} · ${country}`);
  return true;
}
function setStatus(id, status) {
  const b = findBird(id); if (!b || b.status === status) return;
  b.status = status; b.updatedAt = new Date().toISOString();
  saveLocal(); render(); githubSave(true);
  const labels = { working: 'Working', accepted: 'Accepted', rejected: 'Rejected' };
  toast(status === 'accepted' ? 'success' : status === 'rejected' ? 'warning' : 'info', `${b.name} → ${labels[status]}`);
}
function updateBird(id, name, country) {
  const b = findBird(id); if (!b) return false;
  name = name.trim(); country = country.trim();
  if (!name || !country) { toast('warning', 'Missing fields'); return false; }
  if (isDuplicateName(name, id)) { toast('error', `"${name}" already exists`, 'Duplicate names blocked.'); return false; }
  b.name = name; b.country = country; b.updatedAt = new Date().toISOString();
  saveLocal(); render(); githubSave(true);
  toast('success', 'Bird updated');
  return true;
}
function deleteBird(id) {
  const b = findBird(id); if (!b) return;
  state.birds = state.birds.filter(x => x.id !== id);
  saveLocal(); render(); githubSave(true);
  toast('warning', 'Bird deleted', b.name);
}
function copyText(text) {
  navigator.clipboard?.writeText(text).then(
    () => toast('success', 'Copied', text),
    () => {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
      toast('success', 'Copied', text);
    }
  );
}

/* =========================================================
   RENDERING
========================================================= */
function filteredBirds() {
  let list = state.birds.slice();
  if (state.view !== 'all' && state.view !== 'stats') list = list.filter(b => b.status === state.view);
  if (state.search) {
    const q = state.search.toLowerCase();
    list = list.filter(b => b.name.toLowerCase().includes(q) || b.country.toLowerCase().includes(q));
  }
  if (state.filterCountry) list = list.filter(b => b.country === state.filterCountry);
  switch (state.sort) {
    case 'newest': list.sort((a,b) => (b.createdAt||'').localeCompare(a.createdAt||'')); break;
    case 'oldest': list.sort((a,b) => (a.createdAt||'').localeCompare(b.createdAt||'')); break;
    case 'az': list.sort((a,b) => a.name.localeCompare(b.name)); break;
    case 'za': list.sort((a,b) => b.name.localeCompare(a.name)); break;
    case 'country': list.sort((a,b) => a.country.localeCompare(b.country) || a.name.localeCompare(b.name)); break;
  }
  return list;
}

function updateCounts() {
  const c = { all: state.birds.length, working: 0, accepted: 0, rejected: 0 };
  state.birds.forEach(b => c[b.status]++);
  $('#nav-all').textContent = c.all;
  $('#nav-working').textContent = c.working;
  $('#nav-accepted').textContent = c.accepted;
  $('#nav-rejected').textContent = c.rejected;
}

function updateCountryFilter() {
  const sel = $('#countryFilter'); if (!sel) return;
  const countries = [...new Set(state.birds.map(b => b.country))].sort();
  const cur = state.filterCountry;
  sel.innerHTML = `<option value="">All countries</option>` +
    countries.map(c => `<option value="${escapeHtml(c)}" ${c === cur ? 'selected' : ''}>${escapeHtml(c)}</option>`).join('');
}

function birdEmoji(name) {
  const n = name.toLowerCase();
  if (n.includes('eagle') || n.includes('hawk') || n.includes('falcon')) return '🦅';
  if (n.includes('owl')) return '🦉';
  if (n.includes('parrot') || n.includes('macaw') || n.includes('cockatoo')) return '🦜';
  if (n.includes('penguin')) return '🐧';
  if (n.includes('duck') || n.includes('goose') || n.includes('swan')) return '🦆';
  if (n.includes('peacock')) return '🦚';
  if (n.includes('flamingo') || n.includes('crane') || n.includes('stork')) return '🦩';
  if (n.includes('rooster') || n.includes('hen') || n.includes('chicken')) return '🐓';
  if (n.includes('sparrow') || n.includes('finch') || n.includes('robin') || n.includes('warbler')) return '🐤';
  return '🐦';
}

function renderBirdCard(b) {
  const statusPill = `<span class="pill pill-${b.status}">${b.status === 'working' ? '🛠 Working' : b.status === 'accepted' ? '✅ Accepted' : '❌ Rejected'}</span>`;
  return `
    <article class="bird-card" data-status="${b.status}" data-id="${b.id}">
      <div class="bird-top">
        <div class="bird-emoji">${birdEmoji(b.name)}</div>
        <div class="bird-title">
          <div class="bird-name">${escapeHtml(b.name)}</div>
          <div class="bird-country">🌍 ${escapeHtml(b.country)}</div>
        </div>
      </div>
      <div class="bird-meta">${statusPill}<span class="bird-date">${formatDate(b.createdAt)}</span></div>
      <div class="bird-actions">
        <button class="act act-copy" title="Copy name" data-act="copy" data-id="${b.id}">📋</button>
        ${b.status !== 'accepted' ? `<button class="act act-accept" title="Accept" data-act="accept" data-id="${b.id}">✅</button>` : ''}
        ${b.status !== 'rejected' ? `<button class="act act-reject" title="Reject" data-act="reject" data-id="${b.id}">❌</button>` : ''}
        ${b.status !== 'working' ? `<button class="act act-edit" title="Back to Working" data-act="working" data-id="${b.id}">🛠</button>` : ''}
        <button class="act act-edit" title="Edit" data-act="edit" data-id="${b.id}">✏️</button>
        <button class="act act-delete" title="Delete" data-act="delete" data-id="${b.id}">🗑️</button>
      </div>
    </article>`;
}

function renderListView() {
  const list = filteredBirds();
  const viewLabels = { all: 'All Birds', working: 'Working Birds', accepted: 'Accepted Birds', rejected: 'Rejected Birds' };
  $('#pageTitle').textContent = viewLabels[state.view] || 'All Birds';

  $('#content').innerHTML = `
    <div class="toolbar">
      <select id="sortSelect">
        <option value="newest" ${state.sort==='newest'?'selected':''}>🕒 Newest first</option>
        <option value="oldest" ${state.sort==='oldest'?'selected':''}>🕐 Oldest first</option>
        <option value="az" ${state.sort==='az'?'selected':''}>🔤 Name A → Z</option>
        <option value="za" ${state.sort==='za'?'selected':''}>🔤 Name Z → A</option>
        <option value="country" ${state.sort==='country'?'selected':''}>🌍 By country</option>
      </select>
      <select id="countryFilter"><option value="">All countries</option></select>
      <button class="btn btn-ghost" id="exportBtn">⬇ Export JSON</button>
      <button class="btn btn-ghost" id="importBtn">⬆ Import JSON</button>
      <button class="btn btn-ghost" id="syncNowBtn">🔄 Sync now</button>
      <span style="margin-left:auto;font-size:12.5px;color:var(--text-muted);font-weight:700;">
        ${list.length} of ${state.birds.length} shown
      </span>
    </div>
    <form class="add-card" id="addForm">
      <div class="field"><label>Bird name (English) *</label><input type="text" id="newName" placeholder="e.g. Bald Eagle" autocomplete="off" required></div>
      <div class="field"><label>Country *</label><input type="text" id="newCountry" placeholder="e.g. United States" autocomplete="off" required></div>
      <button type="submit" class="btn btn-primary">➕ Add to Working</button>
    </form>
    <div class="grid" id="birdGrid">
      ${list.length ? list.map(renderBirdCard).join('') : ''}
    </div>
    ${!list.length ? `
      <div class="empty">
        <div class="empty-emoji">🪶</div>
        <h3>${state.search || state.filterCountry ? 'No matches found' : 'No birds here yet'}</h3>
        <p>${state.search || state.filterCountry ? 'Try adjusting your search or filters.' : 'Add your first bird using the form above.'}</p>
      </div>` : ''}
  `;
  updateCountryFilter();
  bindListViewEvents();
  attach3DTilt();
}

function renderStatsView() {
  $('#pageTitle').textContent = 'Dashboard';
  const total = state.birds.length;
  const byStatus = { working: 0, accepted: 0, rejected: 0 };
  state.birds.forEach(b => byStatus[b.status]++);
  const countries = [...new Set(state.birds.map(b => b.country))];
  const topCountries = Object.entries(state.birds.reduce((acc, b) => { acc[b.country] = (acc[b.country] || 0) + 1; return acc; }, {}))
    .sort((a, b) => b[1] - a[1]).slice(0, 6);
  const pct = (n) => total ? Math.round(n / total * 100) : 0;

  $('#content').innerHTML = `
    <div class="stats">
      <div class="stat"><div class="stat-label">Total Birds</div><div class="stat-value c-text">${total}</div></div>
      <div class="stat"><div class="stat-label">Working</div><div class="stat-value c-primary">${byStatus.working}</div></div>
      <div class="stat"><div class="stat-label">Accepted</div><div class="stat-value c-success">${byStatus.accepted}</div></div>
      <div class="stat"><div class="stat-label">Rejected</div><div class="stat-value c-danger">${byStatus.rejected}</div></div>
    </div>
    <div class="add-card" style="flex-direction:column;align-items:stretch;gap:18px;">
      <div>
        <h3 style="font-size:15px;font-weight:900;margin-bottom:14px;">Approval Progress</h3>
        ${['working','accepted','rejected'].map(s => `
          <div style="margin-bottom:12px;">
            <div style="display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;margin-bottom:6px;">
              <span style="text-transform:capitalize;">${s}</span>
              <span>${byStatus[s]} (${pct(byStatus[s])}%)</span>
            </div>
            <div style="height:8px;border-radius:6px;background:var(--surface-2);overflow:hidden;border:1px solid var(--border);">
              <div style="height:100%;width:${pct(byStatus[s])}%;
                background:${s==='accepted'?'var(--success)':s==='rejected'?'var(--danger)':'var(--primary)'};
                border-radius:6px;transition:width .4s;"></div>
            </div>
          </div>`).join('')}
      </div>
      <div>
        <h3 style="font-size:15px;font-weight:900;margin-bottom:12px;">Top Countries</h3>
        ${topCountries.length ? topCountries.map(([c, n]) => `
          <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;font-weight:700;">
            <span>🌍 ${escapeHtml(c)}</span><span style="color:var(--text-muted);">${n}</span>
          </div>`).join('') : `<div class="help">No data yet.</div>`}
      </div>
      <div class="help">Unique countries: <strong>${countries.length}</strong></div>
    </div>
  `;
}

function render() {
  updateCounts();
  if (state.view === 'stats') renderStatsView();
  else renderListView();
}

/* =========================================================
   3D TILT
========================================================= */
function attach3DTilt() {
  $$('.bird-card').forEach(card => {
    card.addEventListener('mousemove', e => {
      const r = card.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - 0.5;
      const y = (e.clientY - r.top) / r.height - 0.5;
      card.style.transform = `perspective(900px) translateY(-6px) rotateY(${x * 6}deg) rotateX(${-y * 6}deg) scale(1.02)`;
    });
    card.addEventListener('mouseleave', () => { card.style.transform = ''; });
  });
}

/* =========================================================
   EVENT BINDING
========================================================= */
function bindListViewEvents() {
  $('#sortSelect')?.addEventListener('change', e => { state.sort = e.target.value; render(); });
  $('#countryFilter')?.addEventListener('change', e => { state.filterCountry = e.target.value; render(); });
  $('#exportBtn')?.addEventListener('click', exportJSON);
  $('#importBtn')?.addEventListener('click', importJSON);
  $('#syncNowBtn')?.addEventListener('click', () => { if (!isConnected()) return openSettings(); githubLoad(); });
  $('#addForm')?.addEventListener('submit', e => {
    e.preventDefault();
    const name = $('#newName').value, country = $('#newCountry').value;
    if (addBird(name, country)) { $('#newName').value = ''; $('#newCountry').value = ''; $('#newName').focus(); }
  });
  $('#birdGrid')?.addEventListener('click', e => {
    const btn = e.target.closest('[data-act]'); if (!btn) return;
    const { act, id } = btn.dataset; const b = findBird(id); if (!b) return;
    if (act === 'copy') copyText(b.name);
    else if (act === 'accept') setStatus(id, 'accepted');
    else if (act === 'reject') setStatus(id, 'rejected');
    else if (act === 'working') setStatus(id, 'working');
    else if (act === 'edit') openEditModal(id);
    else if (act === 'delete') openDeleteConfirm(id);
  });
}

/* =========================================================
   MODALS
========================================================= */
function closeModal() { $('.overlay')?.remove(); }

function openEditModal(id) {
  const b = findBird(id); if (!b) return;
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `
    <div class="modal">
      <div class="modal-head"><h3>Edit Bird</h3><button class="modal-close">✕</button></div>
      <div class="modal-body">
        <div class="field"><label>Bird name (English)</label><input type="text" id="editName" value="${escapeHtml(b.name)}"></div>
        <div class="field"><label>Country</label><input type="text" id="editCountry" value="${escapeHtml(b.country)}"></div>
        <div class="modal-actions">
          <button class="btn" id="cancelEdit">Cancel</button>
          <button class="btn btn-primary" id="saveEdit">Save changes</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(ov);
  ov.addEventListener('click', e => { if (e.target === ov) closeModal(); });
  ov.querySelector('.modal-close').onclick = closeModal;
  ov.querySelector('#cancelEdit').onclick = closeModal;
  ov.querySelector('#saveEdit').onclick = () => {
    if (updateBird(id, $('#editName').value, $('#editCountry').value)) closeModal();
  };
  $('#editName').focus();
}

function openDeleteConfirm(id) {
  const b = findBird(id); if (!b) return;
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `
    <div class="modal">
      <div class="modal-head"><h3>Delete Bird</h3><button class="modal-close">✕</button></div>
      <div class="modal-body">
        <p style="font-size:13.5px;line-height:1.6;">Are you sure you want to permanently delete <strong>${escapeHtml(b.name)}</strong> from ${escapeHtml(b.country)}? This cannot be undone.</p>
        <div class="modal-actions">
          <button class="btn" id="cancelDel">Cancel</button>
          <button class="btn btn-primary" id="confirmDel" style="background:var(--danger);border-color:var(--danger);">Delete</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(ov);
  ov.addEventListener('click', e => { if (e.target === ov) closeModal(); });
  ov.querySelector('.modal-close').onclick = closeModal;
  ov.querySelector('#cancelDel').onclick = closeModal;
  ov.querySelector('#confirmDel').onclick = () => { deleteBird(id); closeModal(); };
}

function openSettings() {
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `
    <div class="modal wide">
      <div class="modal-head"><h3>⚙️ Settings</h3><button class="modal-close">✕</button></div>
      <div class="modal-body">
        <div class="settings-section">
          <h4>Appearance</h4>
          <div class="settings-row">
            <div><div class="lbl">Dark mode</div><div class="hint">Use a low-light theme.</div></div>
            <label class="switch"><input type="checkbox" id="sDark" ${state.theme==='dark'?'checked':''}><span class="slider"></span></label>
          </div>
        </div>
        <div class="settings-section">
          <h4>GitHub Sync</h4>
          <div class="field" style="margin-bottom:10px;"><label>Personal Access Token</label><input type="password" id="sToken" value="${escapeHtml(config.token)}" placeholder="ghp_… or github_pat_…"></div>
          <div class="field" style="margin-bottom:10px;"><label>Repository (owner/name)</label><input type="text" id="sRepo" value="${escapeHtml(config.repo)}" placeholder="username/birds-data"></div>
          <div class="field" style="margin-bottom:10px;"><label>File path</label><input type="text" id="sPath" value="${escapeHtml(config.path)}" placeholder="birds.json"></div>
          <div class="field" style="margin-bottom:10px;"><label>Branch</label><input type="text" id="sBranch" value="${escapeHtml(config.branch)}" placeholder="main"></div>
          <div class="settings-row">
            <div><div class="lbl">Auto-sync</div><div class="hint">Save changes to GitHub automatically.</div></div>
            <label class="switch"><input type="checkbox" id="sAuto" ${config.autoSync?'checked':''}><span class="slider"></span></label>
          </div>
          <div class="help" style="margin-top:8px;">Your token needs <code>repo</code> scope (or fine-grained <em>Contents: Read & write</em>). Token is stored in this browser's localStorage — only use on a trusted device.</div>
          <div class="modal-actions" style="justify-content:flex-start;margin-top:10px;">
            <button class="btn" id="sTest">🔌 Test connection</button>
            <button class="btn" id="sPull">⬇ Pull from GitHub</button>
            <button class="btn" id="sPush">⬆ Push to GitHub</button>
          </div>
        </div>
        <div class="settings-section">
          <h4>Data</h4>
          <div class="settings-row">
            <div><div class="lbl">Export all birds</div><div class="hint">Download a JSON backup file.</div></div>
            <button class="btn" id="sExport">⬇ Export</button>
          </div>
          <div class="settings-row">
            <div><div class="lbl">Import from JSON</div><div class="hint">Merge or replace existing data.</div></div>
            <button class="btn" id="sImport">⬆ Import</button>
          </div>
          <div class="settings-row">
            <div><div class="lbl">Clear local data</div><div class="hint">Remove all birds from this browser.</div></div>
            <button class="btn btn-danger" id="sClear">Clear</button>
          </div>
        </div>
        <div class="modal-actions">
          <button class="btn" id="sCancel">Cancel</button>
          <button class="btn btn-primary" id="sSave">Save settings</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(ov);
  ov.addEventListener('click', e => { if (e.target === ov) closeModal(); });
  ov.querySelector('.modal-close').onclick = closeModal;
  ov.querySelector('#sCancel').onclick = closeModal;
  ov.querySelector('#sDark').onchange = (e) => {
    state.theme = e.target.checked ? 'dark' : 'light';
    applyTheme(); localStorage.setItem(THEME_KEY, state.theme);
  };
  ov.querySelector('#sSave').onclick = () => {
    config.token = ov.querySelector('#sToken').value.trim();
    config.repo = ov.querySelector('#sRepo').value.trim();
    config.path = ov.querySelector('#sPath').value.trim() || 'birds.json';
    config.branch = ov.querySelector('#sBranch').value.trim() || 'main';
    config.autoSync = ov.querySelector('#sAuto').checked;
    config.sha = null;
    saveLocal();
    setSyncStatus(isConnected() ? 'ok' : 'err', isConnected() ? 'Ready' : 'Not connected');
    toast('success', 'Settings saved');
    if (isConnected()) githubLoad();
    closeModal();
  };
  ov.querySelector('#sTest').onclick = async () => {
    const prev = { ...config };
    config.token = ov.querySelector('#sToken').value.trim();
    config.repo = ov.querySelector('#sRepo').value.trim();
    config.path = ov.querySelector('#sPath').value.trim();

    if (ok) toast('success', 'Connection OK', `${config.repo}/${config.path}`);

  ov.querySelector('#sPull').onclick = () => {

    config.sha = null;

  };
  ov.querySelector('#sExport').onclick = exportJSON;
  ov.querySelector('#sImport').onclick = importJSON;
  ov.querySelector('#sClear').onclick = () => {
    if (!confirm('Delete all birds from this browser? GitHub will keep its copy until you push.')) return;
    state.birds = []; saveLocal(); render(); toast('warning', 'Local data cleared');
  };
}

/* =========================================================
   IMPORT / EXPORT
========================================================= */
function exportJSON() {
  const blob = new Blob([JSON.stringify(state.birds, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `birds-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(a.href);
  toast('success', 'Exported', `${state.birds.length} birds`);
}
function importJSON() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'application/json';
  input.onchange = () => {
    const f = input.files[0]; if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!Array.isArray(data)) throw new Error('Expected an array of birds');
        const replace = confirm('Replace all current birds with imported data?\n\nOK = Replace\nCancel = Merge (keep existing)');
        let added = 0, skipped = 0;
        if (replace) {
          state.birds = data.filter(x => x && x.name && x.country).map(x => ({
            id: x.id || uid(), name: String(x.name), country: String(x.country),
            status: ['working','accepted','rejected'].includes(x.status) ? x.status : 'working',
            createdAt: x.createdAt || new Date().toISOString(), updatedAt: x.updatedAt || new Date().toISOString(),
          }));
          added = state.birds.length;
        } else {
          const existing = new Set(state.birds.map(b => b.name.toLowerCase()));
          for (const x of data) {
            if (!x || !x.name || !x.country) continue;
            if (existing.has(String(x.name).toLowerCase())) { skipped++; continue; }
            state.birds.push({
              id: uid(), name: String(x.name), country: String(x.country),
              status: ['working','accepted','rejected'].includes(x.status) ? x.status : 'working',
              createdAt: x.createdAt || new Date().toISOString(), updatedAt: new Date().toISOString(),
            });
            existing.add(String(x.name).toLowerCase()); added++;
          }
        }
        saveLocal(); render(); githubSave(true);
        toast('success', 'Import complete', `${added} added${skipped ? `, ${skipped} skipped` : ''}`);
      } catch (e) { toast('error', 'Import failed', e.message); }
    };
    reader.readAsText(f);
  };
  input.click();
}

/* =========================================================
   THEME
========================================================= */
function applyTheme() {
  document.documentElement.setAttribute('data-theme', state.theme);
  $('#themeToggle').textContent = state.theme === 'dark' ? '☀️' : '🌙';
}

/* =========================================================
   NAV / SIDEBAR
========================================================= */
function setView(v) {
  state.view = v;
  $$('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.view === v));
  render();
}
function toggleSidebar(force) {
  const sb = $('#sidebar');
  if (typeof force === 'boolean') sb.classList.toggle('hidden', !force);
  else sb.classList.toggle('hidden');
}
function closeSidebar() { $('#sidebar').classList.add('hidden'); }
function openSidebar() { $('#sidebar').classList.remove('hidden'); }

/* =========================================================
   INIT
========================================================= */
function init() {
  loadLocal();
  applyTheme();
  $('#year').textContent = new Date().getFullYear();
  render();
  setSyncStatus(isConnected() ? 'ok' : 'err', isConnected() ? 'Ready' : 'Not connected');

  $$('.nav-item[data-view]').forEach(el => el.addEventListener('click', () => setView(el.dataset.view)));
  $('#navSettings').addEventListener('click', openSettings);

  $('#themeToggle').addEventListener('click', () => {
    state.theme = state.theme === 'dark' ? 'light' : 'dark';
    applyTheme(); localStorage.setItem(THEME_KEY, state.theme);
  });

  $('#quickAdd').addEventListener('click', () => {
    if (state.view !== 'working' && state.view !== 'all') setView('working');
    setTimeout(() => $('#newName')?.focus(), 50);
  });

  $('#searchInput').addEventListener('input', debounce(e => {
    state.search = e.target.value.trim();
    if (state.view === 'stats') setView('all');
    render();
  }, 180));

  // Menu toggle (open/close)
  $('#menuToggle').addEventListener('click', () => toggleSidebar());
  $('#closeSidebar').addEventListener('click', closeSidebar);

  document.addEventListener('keydown', e => {
    if (e.target.matches('input, textarea, select')) {
      if (e.key === 'Escape') e.target.blur();
      return;
    }
    if (e.key === 'Escape') { closeModal(); closeSidebar(); }
    if (e.key === 'n' && !e.metaKey && !e.ctrlKey && !e.altKey) {
      e.preventDefault();
      if (state.view !== 'working') setView('working');
      setTimeout(() => $('#newName')?.focus(), 50);
    }
    if (e.key === '/' && !e.metaKey && !e.ctrlKey) {
      e.preventDefault(); $('#searchInput').focus();
    }
  });

  if (isConnected()) setTimeout(() => githubLoad(true), 400);
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
